name: Sync source site

on:
  push:
    branches: [master]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v5
        with:
          ref: master
          path: site
          fetch-depth: 0

      - name: Checkout source
        id: source
        uses: actions/checkout@v5
        with:
          repository: eksct/StarYunFan
          ref: master
          path: source
          fetch-depth: 0

      - name: Check whether source changed
        id: freshness
        env:
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          deployed_sha="$(cat site/.github/source-sha 2>/dev/null || true)"
          if [[ "$deployed_sha" == "$SOURCE_SHA" ]]; then
            echo 'up_to_date=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        if: steps.freshness.outputs.up_to_date != 'true'
        with:
          version: '11.19.0'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        if: steps.freshness.outputs.up_to_date != 'true'
        with:
          node-version: '24'

      - name: Install dependencies
        if: steps.freshness.outputs.up_to_date != 'true'
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Lint source
        if: steps.freshness.outputs.up_to_date != 'true'
        working-directory: source
        run: pnpm lint

      - name: Test publishing regressions
        if: steps.freshness.outputs.up_to_date != 'true'
        working-directory: source
        run: pnpm test

      - name: Build site
        if: steps.freshness.outputs.up_to_date != 'true'
        working-directory: source
        run: pnpm run build

      - name: Verify production files
        if: steps.freshness.outputs.up_to_date != 'true'
        working-directory: source
        run: node scripts/verify-dist.mjs

      - name: Update published branch
        if: steps.freshness.outputs.up_to_date != 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email 'github-actions[bot]@users.noreply.github.com'
          git -C site rm -r --quiet --ignore-unmatch -- . ':!.github'
          cp -a source/dist/. site/
          printf '%s\n' "$SOURCE_SHA" > site/.github/source-sha
          git -C site add -A
          if git -C site diff --cached --quiet; then
            echo 'Published site is already up to date.'
            exit 0
          fi
          git -C site commit -m "deploy: ${SOURCE_SHA}"
          git -C site push origin HEAD:master
